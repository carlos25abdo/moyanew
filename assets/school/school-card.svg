    <path d="M -45 10 L 45 10" stroke-width="3" stroke="#DDF5FA" />
    <circle cx="0" cy="30" r="12" fill="#E52532" stroke="none" />
    <!-- Radiating supportive neural aura -->
    <circle cx="0" cy="0" r="120" stroke="rgba(24,166,183,0.3)" stroke-dasharray="8 8" stroke-width="2" />
  </g>
  <text x="300" y="320" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">البيئة المدرسية الواعية</text>
  <text x="300" y="355" font-family="'Inter', sans-serif" font-size="16" fill="#DDF5FA" text-anchor="middle" opacity="0.8">SCHOOL &amp; MOYAMOYA</text>
</svg>
