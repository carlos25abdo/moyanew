<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="schoolGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0757A6" />
      <stop offset="100%" stop-color="#031B3B" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#schoolGrad)" />
  <!-- School / Classroom Concept Graphic -->
  <g transform="translate(300, 160)" stroke="#18A6B7" fill="none" stroke-linecap="round">
