<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="univGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0757A6" />
      <stop offset="100%" stop-color="#010E1F" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#univGrad)" />
  <!-- Academic Mortarboard & Book Motif -->
  <g transform="translate(300, 160)" stroke="#18A6B7" fill="none" stroke-linecap="round">
    <path d="M 0 -50 L 70 -15 L 0 20 L -70 -15 Z" fill="rgba(6,47,99,0.7)" stroke="#FFFFFF" stroke-width="3.5" />
    <path d="M -45 5 L -45 45 C -45 55, 45 55, 45 45 L 45 5" stroke="#FFFFFF" stroke-width="3" />
    <!-- Tassel -->
    <path d="M 50 -5 L 65 30" stroke="#E52532" stroke-width="3.5" />
    <circle cx="65" cy="35" r="5" fill="#E52532" stroke="none" />
    <!-- Horizon arc -->
    <path d="M -120 70 Q 0 40 120 70" stroke="rgba(24,166,183,0.4)" stroke-width="2.5" />
  </g>
  <text x="300" y="320" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">الجامعة والطموح الأكاديمي</text>
  <text x="300" y="355" font-family="'Inter', sans-serif" font-size="16" fill="#DDF5FA" text-anchor="middle" opacity="0.8">UNIVERSITY LIFE &amp; BALANCE</text>
</svg>
