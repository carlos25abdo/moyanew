<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gradCafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A6B7" />
      <stop offset="100%" stop-color="#148BD1" />
    </linearGradient>
  </defs>
  <!-- Cultural Cafe Emblem (Coffee Cup & Open Book Symbol) -->
  <g transform="translate(40, 35)">
    <circle cx="45" cy="45" r="42" fill="rgba(6,47,99,0.4)" stroke="#18A6B7" stroke-width="2.5" />
    <!-- Steam / aroma waves -->
    <path d="M 38 28 Q 42 22 38 16" fill="none" stroke="#5AD8E6" stroke-width="2" stroke-linecap="round" />
    <path d="M 45 26 Q 49 20 45 14" fill="none" stroke="#18A6B7" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 52 28 Q 56 22 52 16" fill="none" stroke="#5AD8E6" stroke-width="2" stroke-linecap="round" />
    <!-- Coffee cup body -->
    <path d="M 30 36 L 60 36 C 60 52, 54 62, 45 62 C 36 62, 30 52, 30 36 Z" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linejoin="round" />
    <!-- Cup handle -->
    <path d="M 60 40 C 66 40, 66 50, 60 52" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Open Book / Saucer base -->
    <path d="M 24 67 Q 45 63 45 67 Q 45 63 66 67" fill="none" stroke="#18A6B7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="71" x2="68" y2="71" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
  <!-- Text -->
  <g transform="translate(145, 75)">
    <text x="0" y="0" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">المقهى الثقافي</text>
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#18A6B7" letter-spacing="1.5">THE CULTURAL CAFE</text>
  </g>
</svg>
